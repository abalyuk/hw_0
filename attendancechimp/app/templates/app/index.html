<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        .bio { max-width: 600px; margin: 0 auto; }
    </style>
</head>
<body>
<div class="bio">
    <h1>AttendanceChimp</h1>
    <p>Electronic class attendance tracking application. Instructors show a QR code in lecture, and students upload a photo of it to check in.</p>
    <hr>
    {% if user.is_authenticated %}
    <p><b>{{ user.username }}</b></p>
    {% else %}
    <p>Not logged in.</p>
    {% endif %}
    <p>{{ time }}</p>
</div>
</body>
</html>
