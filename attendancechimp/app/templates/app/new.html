<!DOCTYPE html>
<html><head><title>Sign Up</title></head>
<body style="text-align:center; font-family:Arial;">
<h1>Sign Up</h1>
<form action="/app/createUser" method="post">
    <p>User name: <input type="text" name="user_name"></p>
    <p>Email: <input type="email" name="email"></p>
    <p>Password: <input type="password" name="password"></p>
    <p>
        <input type="radio" name="is_student" value="1" checked> Student
        <input type="radio" name="is_student" value="0"> Instructor
    </p>
    <input type="submit" value="Sign Up">
</form>
</body>
</html>
