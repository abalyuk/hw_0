<!DOCTYPE html>
<html><head><title>New Course</title></head>
<body style="text-align:center; font-family:Arial;">
<h1>New Course</h1>
<form action="/app/createCourse" method="post">
    <p>Course name: <input type="text" name="course-name"></p>
    <p>Start time: <input type="time" name="start-time"></p>
    <p>End time: <input type="time" name="end-time"></p>
    <p>
        <input type="checkbox" name="day-mon"> Mon
        <input type="checkbox" name="day-tue"> Tue
        <input type="checkbox" name="day-wed"> Wed
        <input type="checkbox" name="day-thu"> Thu
        <input type="checkbox" name="day-fri"> Fri
    </p>
    <input type="submit" value="Create Course">
</form>
</body>
</html>
