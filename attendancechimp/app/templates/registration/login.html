<!DOCTYPE html>
<html><head><title>Login</title></head>
<body style="text-align:center; font-family:Arial;">
<h1>Log In</h1>
<form method="post">
    {% csrf_token %}
    <p>Username: <input type="text" name="username"></p>
    <p>Password: <input type="password" name="password"></p>
    <input type="submit" value="Log In">
</form>
</body>
</html>
